apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: test-filter-already-released-advisory-images
spec:
  description: |
    Test the filter-already-released-advisory-images task with a snapshot containing both
    new and already released images. The task should filter out the already released image.
  workspaces:
    - name: tests-workspace
  tasks:
    - name: setup
      workspaces:
        - name: pipeline
          workspace: tests-workspace
      taskSpec:
        workspaces:
          - name: pipeline
        steps:
          - name: setup-values
            image: quay.io/konflux-ci/release-service-utils:e633d51cd41d73e4b3310face21bb980af7a662f
            script: |
              #!/usr/bin/env bash
              set -eux

              mkdir -p "$(workspaces.pipeline.path)/$(context.pipelineRun.uid)/filter-already-released-advisory-images"
              cd "$(workspaces.pipeline.path)/$(context.pipelineRun.uid)/filter-already-released-advisory-images"

              # Create a test snapshot with both new and already released images
              cat > snapshot.json << EOF
              {
                "spec": {
                  "components": [
                    {
                      "name": "released-component",
                      "version": "1.0.0",
                      "containerImage": "quay.io/test/released-image:1.0.0"
                    },
                    {
                      "name": "new-component",
                      "version": "1.0.0",
                      "containerImage": "quay.io/test/new-image:1.0.0"
                    }
                  ]
                }
              }
              EOF
    - name: run-task
      taskRef:
        name: filter-already-released-advisory-images
      params:
        - name: snapshotPath
          value: "snapshot.json"
        - name: origin
          value: "test-origin"
        - name: advisory_secret_name
          value: "filter-already-released-advisory-images-secret"
        - name: internalRequestPipelineRunName
          value: $(context.pipelineRun.name)
      workspaces:
        - name: data
          workspace: tests-workspace
      runAfter:
        - setup
    - name: check-result
      runAfter:
        - run-task
      params:
        - name: filteredSnapshotPath
          value: $(tasks.run-task.results.filteredSnapshotPath)
        - name: result
          value: $(tasks.run-task.results.result)
        - name: tempDir
          value: "$(workspaces.pipeline.path)/$(context.pipelineRun.uid)/filter-already-released-advisory-images"
      taskSpec:
        params:
          - name: filteredSnapshotPath
            type: string
          - name: result
            type: string
          - name: tempDir
            type: string
        steps:
          - name: check-result
            image: quay.io/konflux-ci/release-service-utils:e633d51cd41d73e4b3310face21bb980af7a662f
            script: |
              #!/usr/bin/env bash
              set -eux

              echo "Test that result is Success"
              test "$(params.result)" == "Success"

              echo "Test that filtered snapshot exists"
              test -f "$(params.tempDir)/$(params.filteredSnapshotPath)"

              echo "Test that filtered snapshot contains only new image"
              FILTERED_SNAPSHOT=$(cat "$(params.tempDir)/$(params.filteredSnapshotPath)")
              COMPONENTS=$(echo "$FILTERED_SNAPSHOT" | jq -c '.spec.components')
              COMPONENTS_COUNT=$(echo "$COMPONENTS" | jq 'length')
              test "$COMPONENTS_COUNT" == "1"

              echo "Test that filtered snapshot contains the correct image"
              IMAGE=$(echo "$COMPONENTS" | jq -r '.[0].containerImage')
              test "$IMAGE" == "quay.io/test/new-image:1.0.0"
      workspaces:
        - name: pipeline
          workspace: tests-workspace
  finally:
    - name: cleanup
      taskSpec:
        steps:
          - name: cleanup
            image: quay.io/konflux-ci/release-service-utils:e633d51cd41d73e4b3310face21bb980af7a662f
            script: |
              #!/usr/bin/env bash
              set -eux
              rm -rf "$(workspaces.pipeline.path)/$(context.pipelineRun.uid)/filter-already-released-advisory-images"
      workspaces:
        - name: pipeline
          workspace: tests-workspace 