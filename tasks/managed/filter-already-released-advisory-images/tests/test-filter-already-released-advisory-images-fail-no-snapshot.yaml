---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: test-filter-already-released-advisory-images-fail-no-snapshot
  annotations:
    test/assert-task-failure: "run-task"
spec:
  description: |
    Validates that the filter-already-released-advisory-images task fails when no snapshot
    is provided. This is a negative test case.
  workspaces:
    - name: tests-workspace
  tasks:
    - name: setup
      taskSpec:
        workspaces:
          - name: data
        steps:
          - name: create-rpa
            image: quay.io/konflux-ci/release-service-utils:latest
            script: |
              #!/usr/bin/env bash
              set -eux

              mkdir -p "$(workspaces.data.path)/$(context.pipelineRun.uid)/results"

              cat > "$(workspaces.data.path)/$(context.pipelineRun.uid)/test_release_plan_admission.json" <<EOF
              {
                "spec": {
                  "origin": "test-origin"
                }
              }
              EOF
      workspaces:
        - name: data
          workspace: tests-workspace

    - name: run-task
      runAfter:
        - setup
      taskRef:
        name: filter-already-released-advisory-images
      params:
        - name: snapshotPath
          value: "$(context.pipelineRun.uid)/test_snapshot_spec.json"
        - name: releasePlanAdmissionPath
          value: "$(context.pipelineRun.uid)/test_release_plan_admission.json"
        - name: resultsDirPath
          value: "$(context.pipelineRun.uid)/results"
        - name: taskGitUrl
          value: "http://localhost"
        - name: taskGitRevision
          value: "main"
        - name: pipelineRunUid
          value: $(context.pipelineRun.uid)
      workspaces:
        - name: data
          workspace: tests-workspace 