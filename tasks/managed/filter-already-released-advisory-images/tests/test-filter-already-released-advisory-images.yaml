---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: test-filter-already-released-advisory-images
spec:
  description: |
    Test pipeline for the filter-already-released-advisory-images managed task.
    This pipeline tests that the task correctly creates and handles InternalRequests.
  params:
    - name: snapshotPath
      description: Path to the snapshot file
      default: snapshot.json
    - name: origin
      description: The origin workspace for the release CR
      default: test-origin
    - name: advisory_secret_name
      description: The name of the secret containing advisory metadata
      default: test-advisory-secret
  workspaces:
    - name: tests-workspace
      description: Workspace for test files
  tasks:
    - name: setup
      taskSpec:
        workspaces:
          - name: tests-workspace
            description: Workspace for test files
        steps:
          - name: create-test-files
            image: registry.access.redhat.com/ubi9/ubi-minimal:latest
            script: |
              #!/bin/bash
              set -ex

              # Create a test snapshot with both new and already released images
              cat > $(workspaces.tests-workspace.path)/$(params.snapshotPath) << 'EOF'
              {
                "components": [
                  {
                    "name": "test-component",
                    "containerImage": "quay.io/test/image:v1.0.0",
                    "version": "1.0.0"
                  },
                  {
                    "name": "new-component",
                    "containerImage": "quay.io/test/new-image:v2.0.0",
                    "version": "2.0.0"
                  }
                ]
              }
              EOF

              # Create a test advisory secret
              cat > $(workspaces.tests-workspace.path)/advisory-secret.yaml << EOF
              apiVersion: v1
              kind: Secret
              metadata:
                name: $(params.advisory_secret_name)
              type: Opaque
              stringData:
                username: test-user
                password: test-password
              EOF

              # Apply the secret
              kubectl apply -f $(workspaces.tests-workspace.path)/advisory-secret.yaml
      workspaces:
        - name: tests-workspace
          workspace: tests-workspace
      params:
        - name: snapshotPath
          value: $(params.snapshotPath)
        - name: origin
          value: $(params.origin)
        - name: advisory_secret_name
          value: $(params.advisory_secret_name)
    - name: run-task
      runAfter:
        - setup
      taskRef:
        name: filter-already-released-advisory-images
      workspaces:
        - name: tests-workspace
          workspace: tests-workspace
      params:
        - name: snapshotPath
          value: $(params.snapshotPath)
        - name: origin
          value: $(params.origin)
        - name: advisory_secret_name
          value: $(params.advisory_secret_name)
    - name: verify-result
      runAfter:
        - run-task
      taskSpec:
        workspaces:
          - name: tests-workspace
            description: Workspace for test files
        steps:
          - name: verify
            image: registry.access.redhat.com/ubi9/ubi-minimal:latest
            script: |
              #!/bin/bash
              set -ex

              # Verify that an InternalRequest was created
              if ! kubectl get internalrequest -l "internal-services.appstudio.openshift.io/pipelinerun-uid=$(context.pipelineRun.uid)" > /dev/null 2>&1; then
                echo "Error: No InternalRequest was created"
                exit 1
              fi

              # Verify that the InternalRequest completed successfully
              if ! kubectl get internalrequest -l "internal-services.appstudio.openshift.io/pipelinerun-uid=$(context.pipelineRun.uid)" -o jsonpath='{.items[0].status.conditions[0].status}' | grep -q "True"; then
                echo "Error: InternalRequest did not complete successfully"
                exit 1
              fi

              # Verify that the filtered snapshot path is returned
              if [ ! -f "$(workspaces.tests-workspace.path)/filtered-snapshot.json" ]; then
                echo "Error: Filtered snapshot file not found"
                exit 1
              fi

              echo "All verifications passed"
