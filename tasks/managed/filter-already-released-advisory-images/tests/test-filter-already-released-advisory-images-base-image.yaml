---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: test-filter-already-released-advisory-images-base-image
spec:
  description: |
    Validates that the filter-already-released-advisory-images task preserves base images
    even if they are already present in advisories. In this test, comp1 is marked as a base
    image and should remain in the snapshot despite being in an advisory.
  workspaces:
    - name: tests-workspace
  params:
    - name: dataDir
      type: string
      description: The location where data will be stored
  tasks:
    - name: setup
      taskSpec:
        workspaces:
          - name: data
        steps:
          - name: create-snapshot-and-rpa
            image: quay.io/konflux-ci/release-service-utils:latest
            script: |
              #!/usr/bin/env bash
              set -eux

              mkdir -p "$(workspaces.data.path)/$(context.pipelineRun.uid)/results"

              cat > "$(workspaces.data.path)/$(context.pipelineRun.uid)/test_release_plan_admission.json" <<EOF
              {
                "spec": {
                  "origin": "test-origin"
                }
              }
              EOF

              cat > "$(workspaces.data.path)/$(context.pipelineRun.uid)/test_snapshot_spec.json" <<EOF
              {
                "application": "myapp",
                "components": [
                  {
                    "name": "comp1",
                    "repository": "quay.io/redhat-prod/base",
                    "containerImage": "quay.io/redhat-prod/base@sha256:base123",
                    "tags": ["latest"],
                    "baseImage": true
                  },
                  {
                    "name": "comp2",
                    "repository": "quay.io/redhat-prod/another",
                    "containerImage": "quay.io/redhat-prod/another@sha256:xyz",
                    "tags": ["v2.0"]
                  }
                ]
              }
              EOF
      workspaces:
        - name: data
          workspace: tests-workspace

    - name: run-task
      runAfter:
        - setup
      taskRef:
        name: filter-already-released-advisory-images
      params:
        - name: snapshotPath
          value: "$(context.pipelineRun.uid)/test_snapshot_spec.json"
        - name: releasePlanAdmissionPath
          value: "$(context.pipelineRun.uid)/test_release_plan_admission.json"
        - name: resultsDirPath
          value: "$(context.pipelineRun.uid)/results"
        - name: dataDir
          value: "$(params.dataDir)"
        - name: taskGitUrl
          value: "http://localhost"
        - name: taskGitRevision
          value: "main"
        - name: pipelineRunUid
          value: $(context.pipelineRun.uid)
      workspaces:
        - name: data
          workspace: tests-workspace

    - name: check-result
      runAfter:
        - run-task
      taskSpec:
        params:
          - name: result
            type: string
          - name: filtered_snapshot
            type: string
        steps:
          - name: assert-filtered
            image: quay.io/konflux-ci/release-service-utils:latest
            script: |
              #!/usr/bin/env bash
              set -eux

              if [[ "$(params.result)" != "Success" ]]; then
                echo "Task failed: $(params.result)"
                exit 1
              fi

              echo "Filtered Snapshot:"
              echo '$(params.filtered_snapshot)' | jq .

              # Verify comp1 (base image) remains
              if ! echo '$(params.filtered_snapshot)' | jq -e '.components[] | select(.name == "comp1" and .baseImage == true)' > /dev/null; then
                echo "Error: comp1 (base image) should still be in the filtered snapshot"
                exit 1
              fi

              # Verify comp2 remains
              if ! echo '$(params.filtered_snapshot)' | jq -e '.components[] | select(.name == "comp2")' > /dev/null; then
                echo "Error: comp2 should still be in the filtered snapshot"
                exit 1
              fi

              # Verify both components remain
              count=$(echo '$(params.filtered_snapshot)' | jq '.components | length')
              if [ "$count" -ne 2 ]; then
                echo "Expected 2 components after filtering, found $count"
                exit 1
              fi
      params:
        - name: result
          value: "$(tasks.run-task.results.result)"
        - name: filtered_snapshot
          value: "$(tasks.run-task.results.filtered_snapshot)" 